<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bathymetry Map</title>
</head>
<body>
    <h1>Bathymetry Map Visualization</h1>
    <div id="map-container">
        <iframe src="/static/bathy_map.html" width="100%" height="600px"></iframe>
    </div>
    <!-- Form to download the COG data -->
    <form method="get" action="{{ url_for('download_cog') }}">
        <input type="hidden" name="file_path" value="{{ file_path }}">
        <input type="hidden" name="north" value="{{ north }}">
        <input type="hidden" name="south" value="{{ south }}">
        <input type="hidden" name="east" value="{{ east }}">
        <input type="hidden" name="west" value="{{ west }}">
        <button type="submit" style="background-color: #17a2b8; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Download COG Data</button>
    </form>
</body>
</html>
