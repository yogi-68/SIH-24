<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process TIFF Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f4f4;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 15px 0;
            text-align: center;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 70px;
            padding: 20px;
        }
        .upload-form {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .upload-form input[type="file"] {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .upload-form button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .upload-form button:hover {
            background-color: #0056b3;
        }
        .tiff-container {
            margin-top: 20px;
            text-align: center;
        }
        .tiff-container img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .download-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
        }
        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <header>
        <h1>Process TIFF Image</h1>
    </header>
    <div class="content">
        <div class="upload-form">
            <form id="uploadForm" method="post" enctype="multipart/form-data">
                <input type="file" id="tiffFile" name="tiffFile" accept=".tif, .tiff" required>
                <button type="submit">Upload TIFF</button>
            </form>
            {% if file_path %}
            <div class="tiff-container">
                <h2>Uploaded TIFF Image</h2>
                <img src="{{ url_for('uploaded_file', filename=file_path.split('/')[-1]) }}" alt="TIFF Image">
                <!-- Form to download the COG data -->
                <form method="get" action="{{ url_for('download_cog') }}">
                    <input type="hidden" name="file_path" value="{{ file_path }}">
                    <input type="hidden" name="north" value="{{ north }}">
                    <input type="hidden" name="south" value="{{ south }}">
                    <input type="hidden" name="east" value="{{ east }}">
                    <input type="hidden" name="west" value="{{ west }}">
                    <button type="submit" class="download-btn" style="background-color: #17a2b8;">Download COG Data</button>
                </form>
            </div>
            {% elif error %}
            <p>{{ error }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
